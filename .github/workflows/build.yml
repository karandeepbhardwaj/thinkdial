name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test core logic
        run: swift test

      - name: Build the menu bar app
        working-directory: App
        run: |
          xcodebuild \
            -scheme ThinkDial \
            -destination 'platform=macOS' \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Package an ad-hoc signed app
        run: |
          set -euo pipefail
          BIN=$(find "$GITHUB_WORKSPACE/build/Build/Products" -type f -name ThinkDial -not -path '*.dSYM/*' | head -n 1)
          echo "Binary: ${BIN}"
          test -n "$BIN"
          chmod +x Scripts/package-app.sh
          Scripts/package-app.sh "$BIN"

      - name: Upload the app zip
        uses: actions/upload-artifact@v4
        with:
          name: ThinkDial-macos
          path: dist/ThinkDial-macos.zip
          if-no-files-found: error

      - name: Attach the zip to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ThinkDial-macos.zip
          generate_release_notes: true
