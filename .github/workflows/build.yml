name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test core logic
        run: swift test

      - name: List Xcode schemes
        working-directory: App
        run: |
          set +e
          echo "===== xcodebuild -list (App/) ====="
          xcodebuild -list
          status=$?
          echo "===== xcodebuild -list exit ${status} ====="
          echo "The menu-bar app is built with swift build. This package directory does not get a ThinkDial scheme."
          exit 0

      - name: Build the menu bar app
        run: |
          set -euo pipefail
          swift build -c release --arch arm64 --package-path App
          BIN=$(find App/.build -type f -name ThinkDial -path '*/release/*' ! -path '*.dSYM/*' | head -n 1)
          echo "Binary: ${BIN}"
          test -n "${BIN}"
          file "${BIN}"
          chmod +x Scripts/package-app.sh
          Scripts/package-app.sh "${BIN}"
          test -d dist/ThinkDial.app/Contents/MacOS/ThinkDial
          test -f dist/ThinkDial.app/Contents/Info.plist
          echo "CFBundleIdentifier=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dist/ThinkDial.app/Contents/Info.plist)"
          echo "LSUIElement=$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' dist/ThinkDial.app/Contents/Info.plist)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dist/ThinkDial.app/Contents/Info.plist)" = "app.thinkdial.ThinkDial"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' dist/ThinkDial.app/Contents/Info.plist)" = "true"
          codesign --verify --verbose=2 dist/ThinkDial.app

      - name: Upload the app zip
        uses: actions/upload-artifact@v4
        with:
          name: ThinkDial-macos
          path: dist/ThinkDial-macos.zip
          if-no-files-found: error

      - name: Attach the zip to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ThinkDial-macos.zip
          generate_release_notes: true
